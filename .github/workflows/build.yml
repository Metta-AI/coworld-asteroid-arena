name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          ln -s "$GITHUB_WORKSPACE" asteroid_arena
          nimby install "asteroid_arena/asteroid_arena.nimble"
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"
      - run: nim check src/asteroid_arena.nim
      - run: nim r tests/tests.nim
